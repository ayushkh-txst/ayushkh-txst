<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ayush Khadka — CS at Texas State, full-stack developer, building toward AI engineering">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="1" stop-color="#121a2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2547"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      .star { fill: #e2e8f0; animation: twinkle 3.2s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.4s; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

      .trace { fill: none; stroke: url(#accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.5s ease-out .3s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .snow { fill: #e2e8f0; opacity: 0; animation: fadeIn 1s ease-out 3.2s forwards; }
      .flag { fill: #5eead4; opacity: 0; animation: fadeIn .6s ease-out 3.6s forwards; }
      @keyframes fadeIn { to { opacity: 1; } }

      .name { font: 800 58px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .tag  { font: 500 20px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 500 17px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #5eead4; }
      .dim  { fill: #64748b; }
      .rise { opacity: 0; animation: rise .9s ease-out forwards; }
      .r1 { animation-delay: .2s; } .r2 { animation-delay: .6s; } .r3 { animation-delay: 1.1s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { fill: #5eead4; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#sky)"/>

  <!-- stars -->
  <circle class="star"    cx="640" cy="38"  r="1.4"/>
  <circle class="star s2" cx="712" cy="70"  r="1.1"/>
  <circle class="star s3" cx="790" cy="30"  r="1.6"/>
  <circle class="star s4" cx="868" cy="58"  r="1.1"/>
  <circle class="star"    cx="944" cy="24"  r="1.3"/>
  <circle class="star s2" cx="1016" cy="66" r="1.5"/>
  <circle class="star s3" cx="1090" cy="34" r="1.1"/>
  <circle class="star s4" cx="1150" cy="80" r="1.3"/>
  <circle class="star s3" cx="560" cy="24"  r="1.0"/>
  <circle class="star s4" cx="1110" cy="120" r="1.0"/>

  <!-- far range -->
  <path fill="url(#ridgeFar)" d="M520 320 L590 230 L630 252 L700 170 L742 205 L790 150 L840 196 L880 176 L930 222 L985 160 L1040 214 L1090 186 L1200 250 L1200 320 Z"/>

  <!-- near range, a nod to home -->
  <path fill="url(#ridgeNear)" d="M480 320 L560 262 L610 280 L680 214 L720 236 L770 186 L812 222 L858 120 L905 200 L950 176 L1010 238 L1070 206 L1130 252 L1200 232 L1200 320 Z"/>

  <!-- the trace: a commit graph that turns into a ridgeline -->
  <path class="trace" d="M480 262 L560 262 L610 280 L680 214 L720 236 L770 186 L812 222 L858 120 L905 200 L950 176 L1010 238 L1070 206 L1130 252 L1200 232"/>

  <!-- summit snow + flag -->
  <path class="snow" d="M858 120 L846 142 L854 138 L860 146 L866 138 L872 144 Z"/>
  <line x1="858" y1="120" x2="858" y2="96" stroke="#e2e8f0" stroke-width="2" class="snow"/>
  <path class="flag" d="M858 96 L878 102 L858 108 Z"/>

  <!-- commit nodes along the ridge -->
  <g fill="#0b1020" stroke="#5eead4" stroke-width="2" class="snow">
    <circle cx="680" cy="214" r="4.5"/>
    <circle cx="770" cy="186" r="4.5"/>
    <circle cx="950" cy="176" r="4.5"/>
    <circle cx="1070" cy="206" r="4.5"/>
  </g>

  <!-- text -->
  <text x="60" y="112" class="name rise r1">Ayush Khadka</text>
  <rect x="62" y="130" width="96" height="4" rx="2" fill="url(#accent)" class="rise r1"/>
  <text x="60" y="172" class="tag rise r2">CS @ Texas State · Full-stack dev @ TXST Libraries</text>
  <text x="60" y="202" class="tag rise r2">Building toward AI engineering</text>

  <text x="60" y="262" class="mono rise r3"><tspan class="dim">ayush@txst</tspan> <tspan fill="#818cf8">~</tspan> <tspan class="dim">$</tspan> git push origin next-summit<tspan class="cursor"> ▋</tspan></text>
</svg>
